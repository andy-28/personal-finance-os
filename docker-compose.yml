services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-pfos}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-pfos_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-personal_finance}"
    volumes:
      - pfos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfos} -d ${POSTGRES_DB:-personal_finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pfos_pgdata:
